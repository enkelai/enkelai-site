<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="titel beskrivning" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titel">Schematisk bild av ett chattfönster i ett AI-verktyg</title>
  <desc id="beskrivning">Ett förenklat chattfönster. Till vänster en knapp för ny chatt, under den en utgråad lista med tillval som agenter, bibliotek och schemaläggning som man kan strunta i så länge, och längre ner chatthistoriken med tidigare chattar. Längst ner textfältet där man skriver sin prompt, och nere till höger i textfältet en modellväljare.</desc>

  <!-- Vit bakgrund så att bilden fungerar även i mörkt läge -->
  <rect width="760" height="540" fill="#FFFFFF"/>

  <!-- Fönstret -->
  <rect x="10" y="10" width="740" height="520" rx="16" fill="#FFFFFF"/>
  <path d="M10 46 H230 V530 H26 A16 16 0 0 1 10 514 Z" fill="#F1F5F6"/>
  <path d="M26 10 H734 A16 16 0 0 1 750 26 V46 H10 V26 A16 16 0 0 1 26 10 Z" fill="#E4EBED"/>
  <rect x="10" y="10" width="740" height="520" rx="16" fill="none" stroke="#B4C2C8" stroke-width="2"/>
  <line x1="230" y1="46" x2="230" y2="530" stroke="#D3DDE0" stroke-width="2"/>
  <circle cx="34" cy="28" r="6" fill="#B4C2C8"/>
  <circle cx="54" cy="28" r="6" fill="#B4C2C8"/>
  <circle cx="74" cy="28" r="6" fill="#B4C2C8"/>

  <!-- Ny chatt -->
  <rect x="26" y="62" width="188" height="50" rx="10" fill="#FFFFFF" stroke="#024A61" stroke-width="3"/>
  <text x="120" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#024A61">+ Ny chatt</text>

  <!-- Tillval som finns men inte behövs nu: grått i stället för teal -->
  <rect x="22" y="130" width="196" height="100" rx="10" fill="none" stroke="#A7B3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#C3CDD1">
    <rect x="36" y="146" width="14" height="14" rx="3"/>
    <rect x="36" y="174" width="14" height="14" rx="3"/>
    <rect x="36" y="202" width="14" height="14" rx="3"/>
  </g>
  <g font-size="19" fill="#9AA7AD">
    <text x="60" y="160">Agenter</text>
    <text x="60" y="188">Bibliotek</text>
    <text x="60" y="216">Schemaläggning</text>
  </g>
  <line x1="218" y1="180" x2="246" y2="180" stroke="#A7B3B8" stroke-width="2.5"/>
  <text x="254" y="187" font-size="20" font-weight="bold" fill="#7A888F">Kan du strunta i så länge</text>

  <!-- Chatthistoriken -->
  <rect x="22" y="248" width="196" height="164" rx="10" fill="none" stroke="#024A61" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g font-size="19" fill="#55656D">
    <text x="36" y="282">Ny på jobbet</text>
    <text x="36" y="318">Mötesanteckningar</text>
    <text x="36" y="354">Mejl till kollega</text>
    <text x="36" y="390">Planera semestern</text>
  </g>
  <line x1="120" y1="412" x2="120" y2="426" stroke="#024A61" stroke-width="2.5"/>
  <text x="120" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="#024A61">Chatthistoriken</text>

  <!-- Hälsning i mitten -->
  <text x="490" y="292" text-anchor="middle" font-size="26" fill="#33444C">Vad vill du ha hjälp med?</text>

  <!-- Textfältet -->
  <text x="252" y="376" font-size="22" font-weight="bold" fill="#024A61">Textfältet</text>
  <line x1="270" y1="384" x2="270" y2="400" stroke="#024A61" stroke-width="2.5"/>
  <rect x="250" y="400" width="480" height="100" rx="16" fill="#FFFFFF" stroke="#024A61" stroke-width="3"/>
  <text x="272" y="440" font-size="20" fill="#8A979D">Skriv din fråga här …</text>
  <circle cx="694" cy="464" r="20" fill="#024A61"/>
  <path d="M694 474 V455 M685 463 l9 -9 l9 9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Modellväljaren, nere till höger i textfältet (Eriks iakttagelse 2/10: Gemini, ChatGPT, Claude) -->
  <text x="730" y="376" text-anchor="end" font-size="22" font-weight="bold" fill="#024A61">Modellväljaren</text>
  <line x1="590" y1="384" x2="590" y2="444" stroke="#024A61" stroke-width="2.5"/>
  <rect x="520" y="444" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#024A61" stroke-width="3"/>
  <text x="540" y="471" font-size="20" fill="#33444C">Modell</text>
  <path d="M624 460 l8 8 l8 -8" fill="none" stroke="#33444C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
