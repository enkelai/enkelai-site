<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="titel beskrivning" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titel">Tre nivåer: leverantör, AI-tjänst och modell</title>
  <desc id="beskrivning">Tre nivåer visas som rader för fyra leverantörer. Google levererar AI-tjänsten Gemini med modeller som Pro och Flash. Anthropic levererar Claude med modeller som Fable och Opus. OpenAI levererar ChatGPT med modeller som Astra och Sol. Microsoft levererar Copilot Chat, som använder andras modeller.</desc>

  <!-- Vit bakgrund så att bilden fungerar även i mörkt läge -->
  <rect width="760" height="380" fill="#FFFFFF"/>

  <!-- Tre nivåer som band -->
  <rect x="10" y="14" width="740" height="90" rx="14" fill="#F1F5F6"/>
  <rect x="10" y="132" width="740" height="90" rx="14" fill="#F1F5F6"/>
  <rect x="10" y="250" width="740" height="116" rx="14" fill="#F1F5F6"/>

  <!-- Radetiketter -->
  <g font-size="20" font-weight="bold" fill="#024A61">
    <text x="26" y="66">Leverantör</text>
    <text x="26" y="184">AI-tjänst</text>
    <text x="26" y="304">Modell</text>
  </g>
  <text x="26" y="328" font-size="17" fill="#6B7A81">(exempel)</text>

  <!-- Kopplingar mellan nivåerna -->
  <g stroke="#024A61" stroke-width="2.5">
    <line x1="217" y1="88" x2="217" y2="148"/>
    <line x1="367" y1="88" x2="367" y2="148"/>
    <line x1="517" y1="88" x2="517" y2="148"/>
    <line x1="667" y1="88" x2="667" y2="148"/>
    <line x1="217" y1="206" x2="217" y2="264"/>
    <line x1="367" y1="206" x2="367" y2="264"/>
    <line x1="517" y1="206" x2="517" y2="264"/>
    <line x1="667" y1="206" x2="667" y2="264" stroke-dasharray="6 5"/>
  </g>

  <!-- Nivå 1: leverantör -->
  <g fill="#024A61">
    <rect x="146" y="30" width="142" height="58" rx="10"/>
    <rect x="296" y="30" width="142" height="58" rx="10"/>
    <rect x="446" y="30" width="142" height="58" rx="10"/>
    <rect x="596" y="30" width="142" height="58" rx="10"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="217" y="66">Google</text>
    <text x="367" y="66">Anthropic</text>
    <text x="517" y="66">OpenAI</text>
    <text x="667" y="66">Microsoft</text>
  </g>

  <!-- Nivå 2: AI-tjänst -->
  <g fill="#FFFFFF" stroke="#024A61" stroke-width="3">
    <rect x="146" y="148" width="142" height="58" rx="10"/>
    <rect x="296" y="148" width="142" height="58" rx="10"/>
    <rect x="446" y="148" width="142" height="58" rx="10"/>
    <rect x="596" y="148" width="142" height="58" rx="10"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#024A61" text-anchor="middle">
    <text x="217" y="184">Gemini</text>
    <text x="367" y="184">Claude</text>
    <text x="517" y="184">ChatGPT</text>
    <text x="667" y="173">Copilot</text>
    <text x="667" y="196">Chat</text>
  </g>

  <!-- Nivå 3: modeller (exempel) -->
  <g fill="#FFFFFF" stroke="#B4C2C8" stroke-width="2">
    <rect x="146" y="264" width="142" height="88" rx="10"/>
    <rect x="296" y="264" width="142" height="88" rx="10"/>
    <rect x="446" y="264" width="142" height="88" rx="10"/>
  </g>
  <rect x="596" y="264" width="142" height="88" rx="10" fill="#FFFFFF" stroke="#A7B3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <g font-size="20" fill="#33444C" text-anchor="middle">
    <text x="217" y="302">Pro</text>
    <text x="217" y="330">Flash</text>
    <text x="367" y="302">Fable</text>
    <text x="367" y="330">Opus</text>
    <text x="517" y="302">Astra</text>
    <text x="517" y="330">Sol</text>
  </g>
  <g font-size="20" font-style="italic" fill="#6B7A81" text-anchor="middle">
    <text x="667" y="302">Andras</text>
    <text x="667" y="330">modeller</text>
  </g>
</svg>
